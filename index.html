/* ---------- Search: any command, any shell ---------- */
function matchInfo(e,q){
  const has=t=>t && t.toLowerCase().includes(q);
  if(has(e.name)||has(e.id)||has(e.c.sh)||has(e.t)) return {ok:true};
  if(has(e.c.cmd)) return {ok:true,via:'CMD: '+e.c.cmd};
  if(has(e.c.ps)) return {ok:true,via:'PowerShell: '+e.c.ps};
  if(has(e.al)) return {ok:true,via:'PowerShell alias: '+e.al};
  for(const f of (e.fl||[])){ for(let i=1;i<4;i++){ if(has(f[i])) return {ok:true,via:[null,'CMD','PowerShell','Bash'][i]+': '+f[i]}; } }
  return {ok:false};
}
function runSearch(){
  const q=$('search').value.trim().toLowerCase(); let any=false;
  $('nav').querySelectorAll('.cat').forEach(cat=>{
    if(cat.dataset.guide){ const g=GUIDES.find(x=>x.id===cat.dataset.guide); const ok=!q||g.name.toLowerCase().includes(q); cat.hidden=!ok; any=any||(ok&&!!q); return; }
    let n=0;
    cat.querySelectorAll('li').forEach(li=>{
      const e=byId[li.dataset.id]; const m=q?matchInfo(e,q):{ok:true};
      li.hidden=!m.ok; if(m.ok) n++;
      const v=li.querySelector('.via'); v.hidden=!m.via; v.textContent=m.via||'';
    });
    cat.hidden=q && !n; if(q&&n) any=true;
    const s=cat.querySelector('.sec'); if(q){ s.setAttribute('aria-expanded',n?'true':'false'); s.nextElementSibling.hidden=!n; }
  });
  $('nomatch').hidden=!q||any;
  $('nav').querySelectorAll('.group-label').forEach(g=>g.hidden=!!q);
  if(!q){ $('nav').querySelectorAll('li').forEach(li=>li.hidden=false); markNav(cur); }
}
$('search').addEventListener('input',runSearch);

  if(ev.key==='Enter'){ const b=[...$('nav').querySelectorAll('li:not([hidden]) [data-go]')].find(x=>!x.closest('.cat').hidden); if(b){ go(b.dataset.go); } }

/* folder tree */
function treeHTML(e){
  const v=e.viz, add=v.add||[], rm=v.rm||[], shw=v.show||[];
  const tg=TAGS[e.id]||[];
  const root={name:'project',key:'',dir:true,kids:new Map()};
  [...BASE,...add].forEach(p=>{
    const dir=p.endsWith('/'); const parts=p.replace(/\/$/,'').split('/'); let n=root, key='';
    parts.forEach((part,i)=>{
      const isDir = i<parts.length-1 || dir; key += part + (isDir?'/':'');
      if(!n.kids.has(part)) n.kids.set(part,{name:part,key,dir:isDir,kids:new Map()});
      n=n.kids.get(part);
    });
  });
  const here=v.here, from=v.from!==undefined?v.from:v.here;
  const node=n=>{
    const cls=['nd',n.dir?'dir':''];
    let tag='';
    if(add.includes(n.key)){ cls.push('add'); tag+=`<span class="tag">${esc(tg[0]||'new')}</span>`; }
    if(rm.includes(n.key)){ cls.push('del'); tag+=`<span class="tag">${esc(tg[1]||'deleted')}</span>`; }
    if(shw.includes(n.key)){ cls.push('shw'); tag+=`<span class="tag">${esc(v.tag||'')}</span>`; }
    if(here!==undefined && here===n.key) tag+=`<span class="tag t-now" style="background:var(--navy);color:var(--panel)">you are here</span>`;
    if(from!==undefined && from===n.key) tag+=`<span class="tag t-was" style="background:var(--navy);color:var(--panel)">you are here</span>`;
    const icon=n.name.includes(' -> ')?I_LINK:(n.dir?I_DIR:I_FILE);
    const kids=[...n.kids.values()].sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name));
    return `<li><div class="${cls.join(' ')}">${icon}<span class="nm2">${esc(n.name)}${n.dir?'/':''}</span>${tag}</div>${kids.length?`<ul>${kids.map(node).join('')}</ul>`:''}</li>`;
  };
  const changes = add.length||rm.length||(v.from!==undefined && v.from!==v.here);
  const head = changes ? `<div class="vizhead"><div class="seg" role="group" aria-label="Folder state"><button data-st="pre" aria-pressed="false">Before</button><button data-st="post" aria-pressed="true">After</button></div><span>${summary(add,rm,v)}</span></div>` : `<div class="vizhead"><span>${shw.length?'Highlighted: what the command reads.':'Your project folder.'}</span></div>`;
  return `<div class="viz">${head}<ul class="tree" id="tree">${node(root)}</ul></div>`;
}
function summary(add,rm,v){
  const p=[]; const a=add.filter(x=>!add.some(y=>y!==x && x.startsWith(y))).length; const r=rm.filter(x=>!rm.some(y=>y!==x && x.startsWith(y))).length;
  if(a) p.push(a+' added'); if(r) p.push(r+' removed'); if(v.from!==undefined && v.from!==v.here) p.push('location changes');
  return p.join(', ');
}

function permHTML(){ return `<div class="viz perm" id="perm"></div>`; }
function renderPerm(oct){
  const el=$('perm'); if(!el) return;

  const win=b=> b===7?'F':b===0?'none':'('+[b&4?'R':'',b&2?'W':'',b&1?'X':''].filter(Boolean).join(',')+')';
  const presets=['644','755','600','700','777'].map(p=>`<button class="btn" data-preset="${p}">${p}</button>`).join(' ');
  el.innerHTML=g+`<div class="pout"><div>Command: <code>chmod ${oct} deploy.sh</code> <button class="btn" data-copy="chmod ${oct} deploy.sh">Copy</button></div><div>ls -l shows: <code>${sym} 1 gk gk 120 deploy.sh</code></div><div>Closest Windows idea for the owner: <code>icacls deploy.sh /grant gk:${win(bits[0])}</code></div><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span style="color:var(--muted)">Common:</span>${presets}</div>${oct==='777'?'<div class="co danger" style="margin-top:4px"><b class="k">Danger</b>777 lets every user on the machine change or run this file.</div>':''}</div>`;
  el.querySelectorAll('.pgrid button').forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.w; bits[i]^=+b.dataset.v; renderPerm(bits.join('')); }));
  el.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>renderPerm(b.dataset.preset)));
}

  const catName=CATS.find(c=>c.id===e.cat).name;
  const sub=e.an[0][1]; const subTxt=sub.charAt(0).toUpperCase()+sub.slice(1)+'.';
  let h=`<section class="panel"><div class="hero"><span class="nm">${esc(e.name)}</span><div class="tt"><h2>${esc(e.t)}</h2><p>${esc(subTxt)}</p></div><div class="badges">${lvl}${dng}<span class="badge">${esc(catName)}</span></div><div class="nav2"><button class="btn" id="prevC" aria-label="Previous command">${PREV}</button><span style="align-self:center;font-size:12px;color:var(--muted)">${i+1} / ${FN.length}</span><button class="btn" id="nextC" aria-label="Next command">${NEXT}</button></div></div></section>`;
  h+=`<section class="panel"><div class="panel-head">Same task in each shell<span class="hint">Press <kbd style="font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px">P</kbd> to replay</span><div class="player" style="margin-left:10px"><button class="btn primary" id="playBtn">${PLAY}Play</button></div></div><div class="terms" style="--n:${v.length}">${v.map(s=>termHTML(e,s)).join('')}</div></section>`;
  const anat=`<section class="panel"><div class="panel-head">Anatomy of the Bash command<span class="hint">Hover a part</span></div>${anatomyHTML(e)}</section>`;
  let viz='';
  if(e.viz){
    if(e.viz.st) viz=`<section class="panel"><div class="panel-head">How the text flows</div>${stagesHTML(e)}</section>`;
    else if(e.viz.perm) viz=`<section class="panel"><div class="panel-head">Permission builder<span class="hint">Click r, w, x to try</span></div>${permHTML()}</section>`;
    else viz=`<section class="panel"><div class="panel-head">What happens to the folder</div>${treeHTML(e)}</section>`;
  }
  h+= viz ? `<div class="row r46">${anat}${viz}</div>` : anat;
  h+=`<section class="panel"><div class="panel-head">Options across shells<span class="hint">Click any command to copy it</span></div>${flagsHTML(e)}</section>`;
  h+=`<div class="row r46"><section class="panel"><div class="panel-head">Call-outs</div>${notesHTML(e)}</section><section class="panel"><div class="panel-head">Interview questions<span class="hint">Click to reveal</span></div><div class="qa">${(e.qa||[]).map((q,j)=>qaItem(e.id+'#'+j,q[0],q[1])).join('')}</div></section></div>`;
  const view=$('view'); view.innerHTML=h;
  if(e.viz&&e.viz.perm) renderPerm(e.viz.perm);
  wireAnatomy(view);
  $('prevC').onclick=()=>step(-1); $('nextC').onclick=()=>step(1);
  $('playBtn').onclick=play;
  view.querySelectorAll('.vizhead .seg button').forEach(b=>b.addEventListener('click',()=>setTreeState(b.dataset.st==='pre')));
  if(auto && !reduced) play();
}

async function play(){
  const tok=++playTok; const terms=[...document.querySelectorAll('.term')];
  const parts=terms.map(t=>({cm:t.querySelector('.cm'),lines:[...t.querySelectorAll('.o-line')],nx:t.querySelector('.nx'),body:t.querySelector('.term-body')})).filter(p=>p.cm);
  if(!parts.length) return;
  setTreeState(true);
  parts.forEach(p=>{ p.cm.textContent=''; p.lines.forEach(l=>l.hidden=true); if(p.nx) p.nx.hidden=true; p.cm.insertAdjacentHTML('afterend','<span class="cur tmp"></span>'); });
  const maxLen=Math.max(...parts.map(p=>p.cm.dataset.full.length));
  const dt=Math.max(12,Math.min(38,1100/maxLen));
  for(let i=1;i<=maxLen;i++){
    if(tok!==playTok) return;
    parts.forEach(p=>{ const f=p.cm.dataset.full; if(i<=f.length) p.cm.textContent=f.slice(0,i); });
    await sleep(dt);
  }
  await sleep(260); if(tok!==playTok) return;
  parts.forEach(p=>p.body.querySelectorAll('.cur.tmp').forEach(c=>c.remove()));
  const maxL=Math.max(0,...parts.map(p=>p.lines.length));
  for(let j=0;j<maxL;j++){
    if(tok!==playTok) return;
    parts.forEach(p=>{ if(p.lines[j]){ p.lines[j].hidden=false; } });
    await sleep(55);
  }
  parts.forEach(p=>{ if(p.nx) p.nx.hidden=false; p.body.scrollTop=0; });
  await sleep(250); if(tok!==playTok) return;
  setTreeState(false);
}

let qFilter='all', hideKnown=false;
function allQs(){
  const list=GEN.map((q,i)=>({key:'gen#'+i,cat:'gen',q:q[0],a:q[1]}));
  FN.forEach(e=>(e.qa||[]).forEach((q,j)=>list.push({key:e.id+'#'+j,cat:e.cat,id:e.id,name:e.name,q:q[0],a:q[1]})));
  return list;
}
function updateProgress(){
  const all=allQs(); const n=all.filter(x=>known.has(x.key)).length;
  const p=$('qprog'); if(p){ p.querySelector('i').style.width=(100*n/all.length)+'%'; $('qcount').textContent=`${n} of ${all.length} marked as known`; }
  if(hideKnown) document.querySelectorAll('#qlist details').forEach(d=>{ if(known.has(d.dataset.key)) d.hidden=true; });
}
PAGES.interview=()=>{
  const all=allQs();
  const cats=[['all','All'],['gen','General'],...CATS.map(c=>[c.id,c.name])];
  const groups=qFilter==='all'?[['gen','General'],...CATS.map(c=>[c.id,c.name])]:cats.filter(c=>c[0]===qFilter);
  let list='';
  groups.forEach(([id,name])=>{
    const qs=all.filter(x=>x.cat===id && !(hideKnown&&known.has(x.key)));
    if(!qs.length) return;
    list+=`<div class="qgroup">${esc(name)}</div>`+qs.map(x=>qaItem(x.key,x.q,x.a,x.id?`<a data-go="${x.id}">Open ${esc(x.name)}</a>`:'')).join('');
  });
  page(`<h2>Interview prep</h2><p class="lede">Shell questions come up in support, DevOps, data and developer interviews. Answer out loud first, then open the card. Tick the ones you can explain; your progress stays in this browser.</p>
  <div class="progress"><div class="bar" id="qprog"><i></i></div><span id="qcount"></span></div>
  <div class="filters">${cats.map(c=>`<button data-qf="${c[0]}" aria-pressed="${qFilter===c[0]}">${esc(c[1])}</button>`).join('')}<label style="margin-left:8px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="hideK" ${hideKnown?'checked':''}> Hide the ones I know</label></div>
  <div class="qa" id="qlist">${list||'<p style="color:var(--muted)">Nothing left here. Untick "Hide the ones I know" to review again.</p>'}</div>`);
  updateProgress();
  $('view').querySelectorAll('[data-qf]').forEach(b=>b.addEventListener('click',()=>{ qFilter=b.dataset.qf; PAGES.interview(); }));
  $('hideK').addEventListener('change',ev=>{ hideKnown=ev.target.checked; PAGES.interview(); });
};
