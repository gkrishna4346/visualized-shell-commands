<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visualized Shell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Monoton&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- Theme tokens: navy · white · orange · grey (red only for danger) ---------- */
:root{
  --bg:#EDF0F5; --panel:#FFFFFF; --ink:#14203F; --muted:#5E687C; --line:#D5DAE3; --chip:#F2F4F8;
  --navy:#1B2A5B; --navy-deep:#0F1A3C; --org:#EE7B22; --org-ink:#B9580C; --org-soft:#FFF0E2;
  --grey:#8A93A6; --grey-soft:#EEF0F4; --red:#C62828; --red-soft:#FDECEA;
  --head:#1B2A5B;
  --sans:'Schibsted Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --gap:8px;
  /* terminal skins: these mimic the real apps so each shell is recognisable at a glance */
  --t-cmd:#0C0C0C; --t-cmd-ink:#CCCCCC; --t-ps:#012456; --t-ps-ink:#EEEDF0; --t-sh:#300A24; --t-sh-ink:#EEEEEC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720; --head:#FFFFFF; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A1330; --panel:#121E46; --ink:#E7EBF6; --muted:#9AA6C4; --line:#24346B; --chip:#1A295A;
  --navy:#9DB2F0; --navy-deep:#0B1535; --org:#FF9A45; --org-ink:#FFAA5E; --org-soft:#3A2616;
  --grey:#8C97B5; --grey-soft:#1A2753; --red:#FF6B6B; --red-soft:#3A1720; --head:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.92em}
:focus-visible{outline:2px solid var(--org);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{height:100%;padding:1vh 1vw;display:grid;grid-template-rows:auto 1fr auto;gap:var(--gap)}
.site-foot{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.site-foot a{color:var(--org-ink);text-decoration:none;font-weight:600}
.site-foot a:hover{text-decoration:underline}
header{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;column-gap:18px;min-height:46px}
.brand{font-family:'Monoton','Schibsted Grotesk',system-ui,sans-serif;font-size:clamp(1.6rem,2.4vw,2.1rem);line-height:1;letter-spacing:.02em;color:var(--navy);user-select:none}
:root[data-theme="dark"] .brand{color:var(--org)}
h1{margin:0;color:var(--org-ink);font-size:clamp(1.2rem,2.2vw,1.9rem);font-weight:700;letter-spacing:-.025em;line-height:1}
h1 small{font-size:.5em;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:10px}
.theme-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:18px;height:18px}
:root[data-theme="dark"] .theme-btn{background:var(--org);color:#0A1330;border-color:transparent}
.search{width:clamp(200px,22vw,300px);display:flex;align-items:center;gap:6px;padding:0 10px;height:36px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--muted)}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:13px var(--sans);outline:none}
.search kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 5px;line-height:16px}
.search:focus-within{border-color:var(--org)} .search:focus-within kbd{display:none}

/* shell visibility switch */
.shells{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:18px;padding:3px;background:var(--panel)}
.shells span{font-size:12px;color:var(--muted);padding:0 6px 0 8px}
.shells button{border:1px solid transparent;border-radius:14px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--muted);display:flex;align-items:center;gap:6px;transition:background .15s,color .15s}
.shells button i{width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
.shells button[aria-pressed="false"]{border-style:dashed;border-color:var(--line);text-decoration:line-through;text-decoration-color:var(--grey)}
.shells button[aria-pressed="true"]{color:#fff}
.shells button[aria-pressed="true"] i{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 2px currentColor}
.shells button[aria-pressed="true"] i::after{content:"";width:6px;height:3px;border-left:1.6px solid var(--k);border-bottom:1.6px solid var(--k);transform:translateY(-1px) rotate(-45deg)}
.shells button.sw-cmd[aria-pressed="true"]{background:#4A5163;--k:#4A5163}
.shells button.sw-ps[aria-pressed="true"]{background:#2F64C9;--k:#2F64C9}
.shells button.sw-sh[aria-pressed="true"]{background:var(--org-ink);--k:var(--org-ink)}
:root[data-theme="dark"] .shells button.sw-sh[aria-pressed="true"]{background:#C9661A;--k:#C9661A}
.shells button[aria-pressed="true"] i{box-shadow:none}

.main{display:grid;grid-template-columns:minmax(230px,16fr) 84fr;gap:var(--gap);min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px;font-weight:600;flex:none;min-height:40px}
.panel-head .hint{margin-left:auto;font-weight:400;color:var(--muted);font-size:12.5px}
.panel-body{flex:1;min-height:0;overflow:auto;scrollbar-width:thin}

/* ---------- Sidebar ---------- */
.side nav{padding:6px}
.group-label{font-size:11.5px;color:var(--muted);padding:10px 6px 4px;font-weight:600}
.cat+.cat{margin-top:5px}
.sec{width:100%;display:flex;align-items:center;gap:8px;text-align:left;border:0;cursor:pointer;padding:7px 10px;border-radius:8px;background:var(--navy-deep);color:#8F9BB8;font-size:12px;line-height:1.3}
:root[data-theme="dark"] .sec{background:#1C2C66}
.sec-text{flex:1;min-width:0}
.sec b{display:block;color:#F3F5FA;font-size:13px;font-weight:600}
.sec .count{flex:none;min-width:22px;height:18px;padding:0 6px;border-radius:9px;background:var(--org);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.sec .chev{flex:none;width:14px;height:14px;color:#F3F5FA;transition:transform .2s}
.sec[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sec.gp[aria-current="true"]{box-shadow:inset 3px 0 0 var(--org)}
.items{list-style:none;margin:4px 0 2px;padding:0 0 0 6px}
.items[hidden],.cat[hidden],.nomatch[hidden]{display:none}
.items button{width:100%;text-align:left;border:0;background:transparent;cursor:pointer;padding:5px 8px;border-radius:6px;font-size:12.5px;color:var(--ink);display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline}
.items button code{font-weight:600;color:var(--navy);font-size:12px}
.items button .pt{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.items button .via{grid-column:1/-1;font:11px var(--mono);color:var(--org-ink);margin-top:1px}
.items button:hover{background:var(--chip)}
.items button[aria-current="true"]{background:var(--org-soft)}
.items button[aria-current="true"] code{color:var(--org-ink)}
.nomatch{margin:12px;color:var(--muted);font-size:13px;text-align:center;line-height:1.5}

/* ---------- Content column ---------- */
.view{min-height:0;min-width:0;overflow:auto;scrollbar-width:thin;display:flex;flex-direction:column;gap:var(--gap);padding-right:2px}
.view>*{flex:none}
.row{display:grid;gap:var(--gap);grid-template-columns:1fr 1fr;min-width:0}
.row.r46{grid-template-columns:4fr 6fr}
.row>.panel{min-height:0}

.hero{display:flex;align-items:center;gap:16px;padding:12px 16px;flex-wrap:wrap}
.hero .nm{font:600 clamp(1.6rem,2.6vw,2.2rem)/1 var(--mono);color:var(--head);letter-spacing:-.02em}
.hero .tt h2{margin:0;font-size:18px;letter-spacing:-.01em}
.hero .tt p{margin:3px 0 0;color:var(--muted);font-size:13px}
.hero .badges{display:flex;gap:6px;flex-wrap:wrap}
.hero .nav2{margin-left:auto;display:flex;gap:6px}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.B{background:var(--grey-soft);color:var(--ink)}
.badge.I{background:var(--org-soft);color:var(--org-ink);border-color:transparent}
.badge.A{background:var(--navy);color:#fff;border-color:transparent}
:root[data-theme="dark"] .badge.A{color:#0A1330}
.badge.D{background:var(--red-soft);color:var(--red);border-color:transparent}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:var(--org)}
.btn svg{width:14px;height:14px}
.btn.primary{background:var(--org);border-color:var(--org);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0A1330}

/* terminals */
.player{margin-left:auto;display:flex;align-items:center;gap:6px}
.terms{display:grid;gap:10px;padding:12px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.term{border-radius:10px;overflow:hidden;display:flex;flex-direction:column;min-width:0;border:1px solid rgba(0,0,0,.25)}
.term-bar{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);color:#fff}
.term-bar .dots{display:flex;gap:5px} .term-bar .dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.22)}
.term-bar .al{font:500 11px var(--mono);opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-bar .cp{margin-left:auto;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer;flex:none}
.term-bar .cp:hover{border-color:var(--org)}
.term-body{padding:10px 12px 12px;font:12px/1.55 var(--mono);white-space:pre;min-height:150px;max-height:300px;overflow:auto;scrollbar-width:thin}
.t-cmd{background:var(--t-cmd);color:var(--t-cmd-ink)} .t-ps{background:var(--t-ps);color:var(--t-ps-ink)} .t-sh{background:var(--t-sh);color:var(--t-sh-ink)}
.t-sh .pu{color:#8AE234;font-weight:600} .t-sh .pp{color:#729FCF;font-weight:600}
.t-ps .pr{color:#EEEDF0} .t-cmd .pr{color:#CCCCCC}
.term .cm{color:#fff;font-weight:600}
.t-ps .cm .v{color:#F9F1A5}
.term .na{color:rgba(255,255,255,.55);font-family:var(--sans);font-size:13px;line-height:1.5;white-space:normal}
.term .na b{display:block;color:#fff;margin-bottom:4px}
.cur{display:inline-block;width:.6em;height:1.15em;background:currentColor;vertical-align:-3px;animation:blink 1.1s steps(1) infinite;opacity:.8}
@keyframes blink{50%{opacity:0}}
.term .o-line[hidden],.term .nx[hidden]{display:none}

/* anatomy */
.anat{padding:12px 14px;display:grid;gap:10px}
.anat .line{font:600 15px/1.6 var(--mono);padding:10px 12px;border-radius:8px;background:var(--chip);overflow-x:auto;white-space:nowrap}
.anat .line span{padding:1px 2px;border-radius:3px;cursor:default;box-shadow:inset 0 -2px 0 transparent;transition:background .15s}
.anat .line span.k0{color:var(--navy)} :root[data-theme="dark"] .anat .line span.k0{color:#fff}
.anat .line span.k1{color:var(--org-ink)} .anat .line span.k2{color:var(--grey)}
.anat .line span.on{background:var(--org-soft);box-shadow:inset 0 -2px 0 var(--org)}
.anat ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.anat li{display:grid;grid-template-columns:minmax(80px,auto) 1fr;gap:10px;font-size:13px;line-height:1.45;padding:4px 6px;border-radius:6px}
.anat li code{color:var(--org-ink);font-weight:600;white-space:nowrap}
.anat li.on{background:var(--org-soft)}

/* visual: tree */
.viz{padding:12px 14px}
.viz .seg{display:inline-flex;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.seg button{border:0;background:transparent;font-size:12px;font-weight:600;color:var(--muted);padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.tree{list-style:none;margin:0;padding:0;font:13px/1.5 var(--mono)}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px;border-left:1px dashed var(--line);margin-left:7px}
.tree .nd{display:flex;align-items:center;gap:7px;padding:2px 6px;border-radius:5px;transition:background .3s,opacity .3s}
.tree .nd svg{width:15px;height:15px;flex:none;color:var(--grey)}
.tree .nd.dir svg{color:var(--navy)}
.tree .tag{font:600 10.5px var(--sans);padding:1px 7px;border-radius:9px;margin-left:4px}
.tree .add{background:var(--org-soft)} .tree .add .tag{background:var(--org);color:#fff}
.tree .del{opacity:.55} .tree .del .nm2{text-decoration:line-through} .tree .del .tag{background:var(--red-soft);color:var(--red)}
.tree .shw{background:var(--chip)} .tree .shw .tag{background:var(--navy);color:#fff}
:root[data-theme="dark"] .tree .shw .tag,:root[data-theme="dark"] .tree .add .tag{color:#0A1330}
.tree .here .tag{background:var(--navy);color:#fff}
.tree.pre .add{display:none}
.tree.pre .del{opacity:1} .tree.pre .del .nm2{text-decoration:none}
.tree.pre .tag{display:none} .tree.pre .here0 .tag{display:inline}
.tree.pre .shw{background:transparent}
.vizhead{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--muted)}

/* visual: stages */
.stages{display:flex;align-items:stretch;gap:6px;overflow-x:auto;padding-bottom:4px}
.stage{flex:1 1 0;min-width:150px;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.stage h4{margin:0;padding:6px 10px;font:600 12px var(--mono);background:var(--chip);border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage div{padding:6px 0;font:12px/1.65 var(--mono)}
.stage p{margin:0;padding:0 10px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.stage p.hl{background:var(--org-soft);color:var(--org-ink);font-weight:600}
.stage.dim p:not(.hl){opacity:.5}
.arrow{flex:none;align-self:center;color:var(--org);width:20px}

/* visual: permissions */
.perm{display:grid;gap:12px}
.pgrid{display:grid;grid-template-columns:70px repeat(3,52px) 54px;justify-content:start;gap:6px;align-items:center;font-size:13px}
.pgrid .h{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600}
.pgrid button{height:34px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font:600 14px var(--mono);cursor:pointer;color:var(--muted)}
.pgrid button[aria-pressed="true"]{background:var(--org);border-color:var(--org);color:#fff}
:root[data-theme="dark"] .pgrid button[aria-pressed="true"]{color:#0A1330}
.pgrid .dg{font:600 22px var(--mono);text-align:center;color:var(--head)}
.pout{display:grid;gap:6px;font-size:13px}
.pout code{font-size:14px;padding:2px 6px;border-radius:5px;background:var(--chip)}

/* flags table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;background:var(--panel);position:sticky;top:0}
.tbl td:first-child{font-weight:500;min-width:150px}
.tbl tr:last-child td{border-bottom:0}
.tbl code{color:var(--ink);background:var(--chip);padding:1px 6px;border-radius:4px;font-size:12px;line-height:1.7;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tbl .mu{color:var(--muted);font-size:12px}
.tbl code.cpy{cursor:copy}
.tbl code.cpy:hover{box-shadow:inset 0 0 0 1px var(--org)}
.th-sh{display:inline-flex;align-items:center;gap:6px}
.th-sh i{width:8px;height:8px;border-radius:50%}
.c-cmd i{background:#7D8597} .c-ps i{background:#2F64C9} .c-sh i{background:var(--org)}
.wrapx{overflow-x:auto}

/* callouts */
.cos{padding:12px 14px;display:grid;gap:8px}
.co{padding:9px 12px;border-radius:8px;font-size:13px;line-height:1.5;border-left:3px solid var(--navy);background:var(--chip)}
.co.warn{border-color:var(--org);background:var(--org-soft)}
.co.danger{border-color:var(--red);background:var(--red-soft)}
.co b.k{display:block;font-size:11.5px;margin-bottom:2px;color:var(--muted)}
.co.warn b.k{color:var(--org-ink)} .co.danger b.k{color:var(--red)}
.co code{background:rgba(127,127,127,.14);padding:0 4px;border-radius:3px}

/* Q&A */
.qa{padding:8px 12px;display:grid;gap:6px}
.qa details{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qa summary{cursor:pointer;padding:9px 12px;font-size:13.5px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:flex-start}
.qa summary::-webkit-details-marker{display:none}
.qa summary .q{flex:none;font-size:11px;font-weight:700;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px;margin-top:2px}
:root[data-theme="dark"] .qa summary .q{color:#0A1330}
.qa details[open] summary{background:var(--chip)}
.qa .a{padding:9px 12px 11px 44px;font-size:13px;line-height:1.55;color:var(--ink)}
.qa .meta{display:flex;align-items:center;gap:8px;padding:0 12px 10px 44px;font-size:12px;color:var(--muted)}
.qa .meta label{display:flex;align-items:center;gap:6px;cursor:pointer}
.qa .meta a{color:var(--org-ink);font-weight:600;text-decoration:none;cursor:pointer}
.qa details.known summary{opacity:.6}

/* pages */
.page{padding:22px clamp(16px,3vw,40px) 30px;max-width:1180px}
.page h2{margin:0 0 6px;font-size:clamp(1.4rem,2.4vw,2rem);letter-spacing:-.025em;color:var(--head)}
.page .welcome{margin:0 0 10px;font:600 14px var(--sans);color:var(--org-ink)}
.page .lede{margin:0 0 22px;color:var(--muted);font-size:15px;line-height:1.55;max-width:70ch}
.page h3{margin:26px 0 10px;font-size:16px}
.page p{line-height:1.55;max-width:75ch}
.stack{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;margin:8px 0 4px}
.layer{flex:1 1 200px;padding:14px 16px;border:1px solid var(--line);background:var(--panel);font-size:13px;line-height:1.5}
.layer:first-child{border-radius:10px 0 0 10px} .layer:last-child{border-radius:0 10px 10px 0}
.layer+.layer{border-left:0}
.layer b{display:block;font-size:15px;margin-bottom:4px}
.layer .eg{margin-top:8px;color:var(--muted);font-size:12.5px}
.layer.mid{background:var(--org-soft);border-color:var(--org)}
.layer.mid+.layer{border-left:0}
.fam{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.famc{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.famc .tb{padding:10px 14px;color:#fff;font:600 14px var(--sans);display:flex;justify-content:space-between;align-items:center}
.famc .tb span{font:500 11.5px var(--mono);opacity:.75}
.famc ul{margin:0;padding:10px 14px 12px 30px;font-size:13px;line-height:1.55}
.tryrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tryrow button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 11px;font:600 12.5px var(--mono);cursor:pointer;color:var(--ink)}
.tryrow button:hover{border-color:var(--org);color:var(--org-ink)}
.howto{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:s}
.howto div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;background:var(--panel)}
.howto div::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--org);color:#fff;font-weight:700;font-size:12px;margin-bottom:8px}
.cardtbl{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.cardtbl .tbl td:first-child{min-width:170px}
.cs-cat td{background:var(--navy-deep);color:#F3F5FA;font-weight:600;font-size:12.5px}
:root[data-theme="dark"] .cs-cat td{background:#1C2C66}
.linkish{border:0;background:none;padding:0;cursor:pointer;color:var(--ink);font:500 13px var(--sans);text-align:left}
.linkish:hover{color:var(--org-ink);text-decoration:underline}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--org);border-color:var(--org);color:#fff}
:root[data-theme="dark"] .filters button[aria-pressed="true"]{color:#0A1330}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin:0 0 14px}
.progress .bar{flex:0 1 260px;height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--org);transition:width .3s}
.page .qa{padding:0}
.qgroup{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy-deep);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width: 1250px){ .terms{grid-template-columns:1fr} .term-body{min-height:0} .howto{grid-template-columns:1fr 1fr} }
@media (max-width: 1100px){
  body{overflow:auto;height:auto}
  .app{height:auto}
  .main{grid-template-columns:minmax(0,1fr)}
  .app{padding:8px}
  .hero .nav2{margin-left:0}
  .side .panel-body{max-height:38vh}
  .view{overflow:visible}
  .row,.row.r46{grid-template-columns:minmax(0,1fr)}
  header{grid-template-columns:auto 1fr auto;row-gap:8px}
  .shells{grid-column:1/-1;order:3;justify-self:start}
  .search{grid-column:1/-1;width:100%;order:4}
  .fam{grid-template-columns:1fr}
  .stack{flex-direction:column} .layer,.layer:first-child,.layer:last-child{border-radius:0} .layer+.layer{border-left:1px solid var(--line);border-top:0}
  .layer:first-child{border-radius:10px 10px 0 0} .layer:last-child{border-radius:0 0 10px 10px}
}
@media (max-width: 560px){ .panel-head .hint{display:none} .howto{grid-template-columns:1fr} .shells span{display:none} h1 small{display:none} }
</style>

<body>
<div class="app">
  <header>
    <span class="brand" role="img" aria-label="GK">GK</span>
    <h1>Visualized Shell<small>One task, three shells</small></h1>
    <div class="shells" role="group" aria-label="Shells to show">
      <span>Show</span>
      <button class="sw-cmd" data-sh="cmd" aria-pressed="true"><i></i>CMD</button>
      <button class="sw-ps" data-sh="ps" aria-pressed="true"><i></i>PowerShell</button>
      <button class="sw-sh" data-sh="sh" aria-pressed="true"><i></i>Bash / zsh</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="Type any command: dir, ls, Get-ChildItem…" aria-label="Search commands in any shell" autocomplete="off">
      <kbd aria-hidden="true">/</kbd>
    </div>
    <button class="theme-btn" id="themeBtn" aria-label="Switch to dark theme"></button>
  </header>

  <div class="main">
    <aside class="panel side" aria-label="Topics">
      <div class="panel-head">Topics<span class="hint" id="totalHint"></span></div>
      <div class="panel-body"><nav id="nav"></nav><p class="nomatch" id="nomatch" hidden>No command matches. Try a name from any shell, like <b>findstr</b>, <b>Select-String</b> or <b>grep</b>.</p></div>
    </aside>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
  <footer class="site-foot">Built by Gopikrishna | <a href="mailto:gkrishna.ai.lab@gmail.com">gkrishna.ai.lab@gmail.com</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
/* =========================================================
   DATA — every command: same task in CMD, PowerShell, Bash
   ========================================================= */
const CATS=[
 {id:'nav',  name:'Navigate',               sub:'Where am I, what is here'},
 {id:'files',name:'Files & folders',        sub:'Create, copy, move, delete'},
 {id:'view', name:'Read files',             sub:'Print, page, compare'},
 {id:'text', name:'Search & transform',     sub:'grep, sort, sed and friends'},
 {id:'flow', name:'Pipes & redirection',    sub:'Connect commands together'},
 {id:'proc', name:'Processes',              sub:'What is running, stop it'},
 {id:'net',  name:'Network',                sub:'IP, ports, DNS, APIs, SSH'},
 {id:'perm', name:'Permissions & users',    sub:'chmod, owners, admin'},
 {id:'sys',  name:'System & environment',   sub:'Variables, PATH, disk'},
 {id:'pkg',  name:'Archives & packages',    sub:'tar, zip, install software'}
];
const GUIDES=[
 {id:'start',     name:'Start here',               sub:'Terminal vs shell, how to use'},
 {id:'syntax',    name:'Syntax differences',       sub:'Paths, quotes, variables'},
 {id:'cheat',     name:'Cheat sheet',              sub:'Every command in one table'},
 {id:'interview', name:'Interview prep',           sub:'All questions, track progress'}
];
const BASE=['notes.txt','app.log','data.csv','names.txt','deploy.sh','src/','src/main.py','src/utils.py','backup/','backup/old.txt'];
const LOG=[`09:00:01 INFO  Server started on :8080`,`09:00:07 INFO  User gk logged in`,`09:01:12 ERROR Database timeout`,`09:01:15 WARN  Retrying connection`,`09:01:20 INFO  Connected`,`09:02:44 ERROR Payment failed: card declined`,`09:03:05 INFO  Order 1042 created`];
const NOTES=[`Buy milk`,`Fix login bug`,`Call Ravi`];
const NAMES=[`Ravi`,`Meera`,`Anita`,`Kiran`,`Ravi`,`Anita`];
const CSV=[`id,name,city`,`1,Ravi,Hyderabad`,`2,Meera,Pune`,`3,Kiran,Chennai`];
const PSH=(dir)=>[``,`    Directory: C:\\Users\\gk\\${dir}`,``,`Mode                 LastWriteTime         Length Name`,`----                 -------------         ------ ----`];
const ICACLS=[`processed file: deploy.sh`,`Successfully processed 1 files; Failed processing 0 files`];
const NO_CMD=`No built-in CMD command. Run the PowerShell version, or use Git Bash.`;

const FN=[];
function C(o){ FN.push(o); }

/* ---------------- Navigate ---------------- */
C({id:'pwd',cat:'nav',lvl:'B',name:'pwd',t:`Show current folder`,
 c:{cmd:`cd`,ps:`Get-Location`,sh:`pwd`},al:`pwd, gl`,
 out:{cmd:[`C:\\Users\\gk\\project`],ps:[``,`Path`,`----`,`C:\\Users\\gk\\project`,``],sh:[`/home/gk/project`]},
 viz:{here:''},
 an:[[`pwd`,`print working directory: the full path of the folder you are in`]],
 fl:[[`Print path into a variable`,`for /f %p in ('cd') do set HERE=%p`,`$here = Get-Location`,`here=$(pwd)`],[`Show real path behind links`,`—`,`(Get-Item .).Target`,`pwd -P`]],
 no:[[`tip`,`In CMD, <code>cd</code> with nothing after it prints the folder. In bash, <code>cd</code> alone takes you home.`],[`tip`,`Most prompts already show the folder: <code>~</code> in bash means your home folder.`]],
 qa:[[`What is the "working directory"?`,`The folder the shell is currently in. Relative paths and commands like ls, cp, rm all act relative to it.`]]});

C({id:'ls',cat:'nav',lvl:'B',name:'ls',t:`List files and folders`,
 c:{cmd:`dir`,ps:`Get-ChildItem`,sh:`ls -l`},al:`ls, dir, gci`,
 out:{cmd:[` Directory of C:\\Users\\gk\\project`,``,`01-10-2026  09:12    <DIR>          backup`,`01-10-2026  09:12    <DIR>          src`,`01-10-2026  09:03               243 app.log`,`30-09-2026  18:40                59 data.csv`,`30-09-2026  17:22               120 deploy.sh`,`29-09-2026  11:05                34 names.txt`,`29-09-2026  10:15                33 notes.txt`,`               5 File(s)            489 bytes`,`               2 Dir(s)  48,203,513,856 bytes free`],
  ps:[...PSH('project'),`d----          01-10-2026    09:12                backup`,`d----          01-10-2026    09:12                src`,`-a---          01-10-2026    09:03            243 app.log`,`-a---          30-09-2026    18:40             59 data.csv`,`-a---          30-09-2026    17:22            120 deploy.sh`,`-a---          29-09-2026    11:05             34 names.txt`,`-a---          29-09-2026    10:15             33 notes.txt`],
  sh:[`total 28`,`-rw-r--r-- 1 gk gk  243 Oct  1 09:03 app.log`,`drwxr-xr-x 2 gk gk 4096 Oct  1 09:12 backup`,`-rw-r--r-- 1 gk gk   59 Sep 30 18:40 data.csv`,`-rwxr-xr-x 1 gk gk  120 Sep 30 17:22 deploy.sh`,`-rw-r--r-- 1 gk gk   34 Sep 29 11:05 names.txt`,`-rw-r--r-- 1 gk gk   33 Sep 29 10:15 notes.txt`,`drwxr-xr-x 2 gk gk 4096 Oct  1 09:12 src`]},
 viz:{show:['notes.txt','app.log','data.csv','names.txt','deploy.sh','src/','backup/'],tag:'listed'},
 an:[[`ls`,`list folder contents`],[`-l`,`long format: permissions, owner, size, date`]],
 fl:[[`Include hidden files`,`dir /a`,`Get-ChildItem -Force`,`ls -a`],[`Include subfolders`,`dir /s`,`Get-ChildItem -Recurse`,`ls -R`],[`Newest first`,`dir /o-d`,`Get-ChildItem | Sort-Object LastWriteTime -Descending`,`ls -lt`],[`Only folders`,`dir /ad`,`Get-ChildItem -Directory`,`ls -d */`],[`Human-readable sizes`,`—`,`—`,`ls -lh`]],
 no:[[`warn`,`In PowerShell, <code>ls</code> and <code>dir</code> work because they are aliases of Get-ChildItem. But <code>ls -la</code> fails: Linux flags are not PowerShell parameters.`],[`tip`,`Files that start with a dot (<code>.env</code>, <code>.git</code>) are hidden on Linux and macOS. Use <code>ls -a</code> to see them.`]],
 qa:[[`What do the columns in ls -l mean?`,`Permissions, link count, owner, group, size in bytes, last-modified date, name. The first character is the type: d for a directory, - for a file, l for a link.`],[`How do you list hidden files in PowerShell?`,`Get-ChildItem -Force. Hidden and system items are skipped unless you add -Force.`]]});

C({id:'cd',cat:'nav',lvl:'B',name:'cd',t:`Change folder`,
 c:{cmd:`cd src`,ps:`Set-Location src`,sh:`cd src`},al:`cd, sl, chdir`,after:'project/src',
 out:{cmd:[],ps:[],sh:[]},
 viz:{here:'src/',from:''},
 an:[[`cd`,`change directory`],[`src`,`a relative path: a folder inside the current one`]],
 fl:[[`Up one level`,`cd ..`,`Set-Location ..`,`cd ..`],[`Home folder`,`cd %USERPROFILE%`,`Set-Location ~`,`cd ~  (or just cd)`],[`Back to previous folder`,`—  (use pushd / popd)`,`Set-Location -  (PowerShell 7)`,`cd -`],[`Switch drive as well`,`cd /d D:\\work`,`Set-Location D:\\work`,`cd /mnt/d/work  (WSL)`],[`Folder name with spaces`,`cd "My Files"`,`Set-Location "My Files"`,`cd "My Files"`]],
 no:[[`warn`,`In CMD, <code>cd D:\\work</code> typed on the C: drive does not take you to D:. Add <code>/d</code>, or type <code>D:</code> first.`],[`tip`,`Press Tab to complete folder names in all three shells. It saves typing and avoids typos.`]],
 qa:[[`What is the difference between an absolute and a relative path?`,`An absolute path starts from the root (C:\\ or /) and works from anywhere. A relative path starts from the current folder, like src or ../backup.`],[`What do . and .. mean?`,`. is the current folder and .. is its parent. They work in all three shells.`]]});

C({id:'tree',cat:'nav',lvl:'B',name:'tree',t:`Show the folder tree`,
 c:{cmd:`tree /f`,ps:`tree /f`,sh:`tree`},
 out:{cmd:[`Folder PATH listing`,`C:.`,`│   app.log`,`│   data.csv`,`│   deploy.sh`,`│   names.txt`,`│   notes.txt`,`│`,`├───backup`,`│       old.txt`,`│`,`└───src`,`        main.py`,`        utils.py`],
  ps:[`Folder PATH listing`,`C:.`,`│   app.log`,`│   data.csv`,`│   deploy.sh`,`│   names.txt`,`│   notes.txt`,`│`,`├───backup`,`│       old.txt`,`│`,`└───src`,`        main.py`,`        utils.py`],
  sh:[`.`,`├── app.log`,`├── backup`,`│   └── old.txt`,`├── data.csv`,`├── deploy.sh`,`├── names.txt`,`├── notes.txt`,`└── src`,`    ├── main.py`,`    └── utils.py`,``,`2 directories, 8 files`]},
 viz:{show:BASE,tag:'listed'},
 an:[[`tree`,`draw folders and files as a tree`]],
 fl:[[`Show files, not only folders`,`tree /f`,`tree /f`,`tree  (files shown by default)`],[`Limit the depth`,`—`,`—`,`tree -L 2`],[`Plain ASCII lines`,`tree /a`,`tree /a`,`tree --charset ascii`]],
 no:[[`tip`,`PowerShell has no tree cmdlet. Typing <code>tree</code> there runs the same tree.com program that CMD uses.`],[`warn`,`<code>tree</code> is often missing on Linux and macOS. Install it with <code>sudo apt install tree</code> or <code>brew install tree</code>.`]],
 qa:[[`How would you show a project's folder structure in a README?`,`Run tree (tree -L 2 on Linux to limit depth, or tree /f /a on Windows for plain ASCII) and paste the result into a code block.`]]});

C({id:'clear',cat:'nav',lvl:'B',name:'clear',t:`Clear the screen`,
 c:{cmd:`cls`,ps:`Clear-Host`,sh:`clear`},al:`cls, clear`,
 out:{cmd:[],ps:[],sh:[]},
 an:[[`clear`,`wipe the visible screen`]],
 fl:[[`Keyboard shortcut`,`—`,`Ctrl + L`,`Ctrl + L`]],
 no:[[`tip`,`Clearing the screen keeps your history. Earlier commands are still one ↑ key away.`]],
 qa:[[`Does clear delete your command history?`,`No. It only clears the screen. History is stored separately (history in bash, Get-History in PowerShell).`]]});

C({id:'history',cat:'nav',lvl:'B',name:'history',t:`See past commands`,
 c:{cmd:`doskey /history`,ps:`Get-History`,sh:`history`},al:`h, history, ghy`,
 out:{cmd:[`cd src`,`cd ..`,`dir`,`doskey /history`],ps:[``,`  Id CommandLine`,`  -- -----------`,`   1 Set-Location src`,`   2 Set-Location ..`,`   3 Get-ChildItem`,``],sh:[`  501  cd src`,`  502  cd ..`,`  503  ls -l`,`  504  history`]},
 an:[[`history`,`list the commands you ran earlier, numbered`]],
 fl:[[`Search history as you type`,`F7 (pick from a list)`,`Ctrl + R`,`Ctrl + R`],[`Run the last command again`,`F3`,`Invoke-History  (alias r)`,`!!`],[`Run command number N`,`—`,`Invoke-History N`,`!N`]],
 no:[[`tip`,`<code>sudo !!</code> re-runs your last command with admin rights: the classic fix for "Permission denied".`],[`warn`,`Get-History only covers this session. Older PowerShell commands live in a file: <code>(Get-PSReadLineOption).HistorySavePath</code>.`]],
 qa:[[`What does !! do in bash?`,`It expands to the previous command, so sudo !! repeats the last command with sudo.`],[`How do you find a command you ran yesterday?`,`Press Ctrl+R in bash or PowerShell and type part of it, or search the list with history | grep word.`]]});

/* ---------------- Files & folders ---------------- */
C({id:'touch',cat:'files',lvl:'B',name:'touch',t:`Create an empty file`,
 c:{cmd:`type nul > todo.txt`,ps:`New-Item todo.txt`,sh:`touch todo.txt`},al:`ni`,
 out:{cmd:[],ps:[...PSH('project'),`-a---          01-10-2026    10:22              0 todo.txt`,``],sh:[]},
 viz:{add:['todo.txt']},
 an:[[`touch`,`create the file if it is missing, or update its timestamp`],[`todo.txt`,`name of the file`]],
 fl:[[`Several files at once`,`type nul > a.txt & type nul > b.txt`,`New-Item a.txt, b.txt`,`touch a.txt b.txt`],[`Create with some text`,`echo hello > a.txt`,`Set-Content a.txt "hello"`,`echo hello > a.txt`]],
 no:[[`danger`,`<code>type nul &gt; file</code> empties the file if it already exists. Use <code>&gt;&gt;</code> instead of <code>&gt;</code> to be safe.`],[`warn`,`<code>New-Item</code> fails if the file exists, and <code>New-Item -Force</code> replaces it with an empty one. <code>touch</code> never erases content.`]],
 qa:[[`What does touch do to a file that already exists?`,`It updates the file's modified time and leaves the content alone. Build tools use this to mark files as changed.`]]});

C({id:'mkdir',cat:'files',lvl:'B',name:'mkdir',t:`Create a folder`,
 c:{cmd:`mkdir reports\\2026`,ps:`New-Item -ItemType Directory reports\\2026`,sh:`mkdir -p reports/2026`},al:`mkdir, md`,
 out:{cmd:[],ps:[...PSH('project\\reports'),`d----          01-10-2026    10:22                2026`,``],sh:[]},
 viz:{add:['reports/','reports/2026/']},
 an:[[`mkdir`,`make directory`],[`-p`,`also create missing parent folders, and stay quiet if it already exists`],[`reports/2026`,`a nested path: reports, then 2026 inside it`]],
 fl:[[`Create parent folders too`,`(automatic)`,`(automatic)`,`mkdir -p a/b/c`],[`Several folders at once`,`mkdir a b c`,`mkdir a, b, c`,`mkdir a b c`],[`No error if it exists`,`—`,`New-Item ... -Force`,`mkdir -p`]],
 no:[[`tip`,`CMD and PowerShell create missing parent folders on their own. Bash needs <code>-p</code>, otherwise it says "No such file or directory".`],[`tip`,`PowerShell has a built-in <code>mkdir</code> shortcut, so <code>mkdir reports</code> works there too.`]],
 qa:[[`How do you create a/b/c in one command on Linux?`,`mkdir -p a/b/c. Without -p, mkdir fails because a and a/b don't exist yet.`]]});

C({id:'cp',cat:'files',lvl:'B',name:'cp',t:`Copy a file`,
 c:{cmd:`copy notes.txt backup\\`,ps:`Copy-Item notes.txt backup\\`,sh:`cp notes.txt backup/`},al:`cp, copy, cpi`,
 out:{cmd:[`        1 file(s) copied.`],ps:[],sh:[]},
 viz:{add:['backup/notes.txt']},
 an:[[`cp`,`copy`],[`notes.txt`,`source: what to copy`],[`backup/`,`destination: where the copy goes`]],
 fl:[[`Copy a whole folder`,`robocopy src dest /e`,`Copy-Item src dest -Recurse`,`cp -r src dest`],[`Ask before overwriting`,`copy /-y`,`Copy-Item ... -Confirm`,`cp -i`],[`Keep timestamps & permissions`,`robocopy src dest /e /copyall`,`—`,`cp -a`],[`Print each file copied`,`—`,`Copy-Item ... -Verbose`,`cp -v`]],
 no:[[`warn`,`<code>cp</code> and <code>Copy-Item</code> overwrite the destination without asking. Add <code>-i</code> in bash or <code>-Confirm</code> in PowerShell when it matters.`],[`tip`,`For big folder copies on Windows, <code>robocopy</code> is faster than copy/xcopy and can resume after a failure.`]],
 qa:[[`How do you copy a directory recursively?`,`cp -r src dest on Linux/macOS, Copy-Item src dest -Recurse in PowerShell, robocopy src dest /e in CMD.`],[`What is the difference between cp -r and cp -a?`,`-a (archive) is -r plus keeping permissions, timestamps, ownership and symlinks. Use it for backups.`]]});

C({id:'mv',cat:'files',lvl:'B',name:'mv',t:`Move or rename`,
 c:{cmd:`move app.log backup\\`,ps:`Move-Item app.log backup\\`,sh:`mv app.log backup/`},al:`mv, move, mi`,
 out:{cmd:[`        1 file(s) moved.`],ps:[],sh:[]},
 viz:{add:['backup/app.log'],rm:['app.log']},
 an:[[`mv`,`move; also used to rename`],[`app.log`,`what to move`],[`backup/`,`where it goes. A new name here instead of a folder would rename the file.`]],
 fl:[[`Rename a file`,`ren app.log old.log`,`Rename-Item app.log old.log`,`mv app.log old.log`],[`Ask before overwriting`,`move /-y`,`Move-Item ... -Confirm`,`mv -i`],[`Never overwrite`,`—`,`—`,`mv -n`]],
 no:[[`tip`,`Bash has no separate rename command for one file: renaming is moving to a new name in the same folder.`],[`warn`,`<code>ren</code> in CMD only renames. It cannot move a file into another folder.`]],
 qa:[[`How do you rename a file in Linux?`,`mv old.txt new.txt. Moving within the same folder under a new name is a rename.`],[`Why is mv instant even for a huge file?`,`On the same disk, mv only updates the directory entry; the data isn't copied. Across disks it copies, then deletes.`]]});

C({id:'rm',cat:'files',lvl:'B',name:'rm',t:`Delete a file`,d:1,
 c:{cmd:`del notes.txt`,ps:`Remove-Item notes.txt`,sh:`rm notes.txt`},al:`rm, del, ri`,
 out:{cmd:[],ps:[],sh:[]},
 viz:{rm:['notes.txt']},
 an:[[`rm`,`remove`],[`notes.txt`,`the file to delete`]],
 fl:[[`Ask before each delete`,`del /p`,`Remove-Item ... -Confirm`,`rm -i`],[`Delete by pattern`,`del *.tmp`,`Remove-Item *.tmp`,`rm *.tmp`],[`Preview, delete nothing`,`dir *.tmp`,`Remove-Item *.tmp -WhatIf`,`ls *.tmp`],[`Include read-only files`,`del /f`,`Remove-Item ... -Force`,`rm -f`]],
 no:[[`danger`,`Files deleted from a shell skip the Recycle Bin and Trash. There is no undo.`],[`tip`,`PowerShell's <code>-WhatIf</code> prints what would be deleted without touching anything. Use it before any wildcard delete.`]],
 qa:[[`Can you recover a file deleted with rm?`,`Not with a normal command, because it never went to the Trash. Recovery needs backups, version control or forensic tools.`],[`What does rm -f do?`,`Never prompts, deletes write-protected files, and doesn't complain if the file is missing.`]]});

C({id:'rmdir',cat:'files',lvl:'I',name:'rm -r',t:`Delete a folder`,d:1,
 c:{cmd:`rmdir /s /q backup`,ps:`Remove-Item backup -Recurse -Force`,sh:`rm -rf backup`},al:`rm, rd, rmdir`,
 out:{cmd:[],ps:[],sh:[]},
 viz:{rm:['backup/','backup/old.txt']},
 an:[[`rm`,`remove`],[`-r`,`recursive: the folder and everything inside it`],[`-f`,`force: no prompts, no error for missing files`],[`backup`,`the folder to delete`]],
 fl:[[`Only if the folder is empty`,`rmdir backup`,`Remove-Item backup`,`rmdir backup`],[`With everything inside`,`rmdir /s backup`,`Remove-Item backup -Recurse`,`rm -r backup`],[`No confirmation at all`,`rmdir /s /q backup`,`Remove-Item backup -Recurse -Force`,`rm -rf backup`]],
 no:[[`danger`,`<code>rm -rf</code> with a wrong path, such as a stray space in <code>rm -rf / tmp</code>, can wipe the system. Run <code>ls</code> on the exact path first.`],[`tip`,`Plain <code>rmdir</code> only removes empty folders in every shell, which makes it a safe default.`]],
 qa:[[`What is the difference between rmdir and rm -r?`,`rmdir only removes an empty directory. rm -r removes a directory with everything in it.`],[`Why is rm -rf considered dangerous?`,`It deletes recursively, without asking and without the Trash, so a typo in the path is never caught.`]]});

C({id:'ln',cat:'files',lvl:'I',name:'ln -s',t:`Create a link (shortcut)`,
 c:{cmd:`mklink /d latest backup`,ps:`New-Item -ItemType SymbolicLink latest -Target backup`,sh:`ln -s backup latest`},
 out:{cmd:[`symbolic link created for latest <<===>> backup`],ps:[...PSH('project'),`l----          01-10-2026    10:22                latest -> backup`,``],sh:[]},
 viz:{add:['latest -> backup']},
 an:[[`ln`,`link`],[`-s`,`symbolic (soft) link: a pointer to a path`],[`backup`,`target: what the link points to`],[`latest`,`name of the new link`]],
 fl:[[`Soft link to a file`,`mklink link.txt notes.txt`,`New-Item -ItemType SymbolicLink link.txt -Target notes.txt`,`ln -s notes.txt link.txt`],[`Soft link to a folder`,`mklink /d latest backup`,`New-Item -ItemType SymbolicLink latest -Target backup`,`ln -s backup latest`],[`Hard link`,`mklink /h link.txt notes.txt`,`New-Item -ItemType HardLink link.txt -Target notes.txt`,`ln notes.txt link.txt`]],
 no:[[`warn`,`The argument order is reversed: <code>ln -s TARGET LINK</code>, but <code>mklink LINK TARGET</code>.`],[`warn`,`On Windows, creating symbolic links needs an admin shell or Developer Mode.`]],
 qa:[[`What is the difference between a hard link and a soft link?`,`A soft link stores a path and breaks if the target is moved or deleted. A hard link is another name for the same data, which stays until every name is deleted. Hard links can't cross drives or point to folders.`]]});

C({id:'find',cat:'files',lvl:'I',name:'find',t:`Find files by name`,
 c:{cmd:`dir /s /b *.py`,ps:`Get-ChildItem -Recurse -Filter *.py`,sh:`find . -name "*.py"`},
 out:{cmd:[`C:\\Users\\gk\\project\\src\\main.py`,`C:\\Users\\gk\\project\\src\\utils.py`],ps:[...PSH('project\\src'),`-a---          28-09-2026    16:40            512 main.py`,`-a---          28-09-2026    16:41            204 utils.py`,``],sh:[`./src/main.py`,`./src/utils.py`]},

 fl:[[`Ignore case in the name`,`(always)`,`(always)`,`find . -iname "*.py"`],[`Only folders`,`dir /s /b /ad`,`Get-ChildItem -Recurse -Directory`,`find . -type d`],[`Changed in the last day`,`forfiles /s /d +0`,`Get-ChildItem -Recurse | Where-Object LastWriteTime -gt (Get-Date).AddDays(-1)`,`find . -mtime -1`],[`Bigger than 100 MB`,`—`,`Get-ChildItem -Recurse | Where-Object Length -gt 100MB`,`find . -size +100M`]],

/* ---------------- Read files ---------------- */
C({id:'cat',cat:'view',lvl:'B',name:'cat',t:`Print a file`,
 c:{cmd:`type notes.txt`,ps:`Get-Content notes.txt`,sh:`cat notes.txt`},al:`cat, type, gc`,
 out:{cmd:NOTES,ps:NOTES,sh:NOTES},
 viz:{st:[{l:'notes.txt',v:NOTES},{l:'screen',v:NOTES}]},
 an:[[`cat`,`concatenate: print one or more files, one after another`],[`notes.txt`,`the file to print`]],
 fl:[[`Join several files`,`type a.txt b.txt`,`Get-Content a.txt, b.txt`,`cat a.txt b.txt`],[`Number the lines`,`findstr /n "^" notes.txt`,`Get-Content notes.txt | ForEach-Object { "$($_.ReadCount) $_" }`,`cat -n notes.txt`],[`Merge into a new file`,`type a.txt b.txt > all.txt`,`Get-Content a.txt, b.txt | Set-Content all.txt`,`cat a.txt b.txt > all.txt`]],
 no:[[`tip`,`cat is short for con<b>cat</b>enate: joining files is its real job.`],[`warn`,`Don't cat a huge log; it floods the screen. Use less, head or tail.`]],
 qa:[[`Why is it called cat?`,`Short for concatenate. It prints files one after another, so cat a b > c joins them into c.`]]});

C({id:'less',cat:'view',lvl:'B',name:'less',t:`Read a long file page by page`,

 no:[[`tip`,`"less is more": less is a newer more that can also scroll backwards and search.`],[`tip`,`<code>man</code> pages open in less, so the same keys (/, n, q) work there.`]],
 qa:[[`How do you search inside less?`,`Type / followed by the word and press Enter. n jumps to the next match, N to the previous one.`]]});

C({id:'head',cat:'view',lvl:'B',name:'head',t:`First lines of a file`,

C({id:'tail',cat:'view',lvl:'B',name:'tail',t:`Last lines, or watch a log`,

 out:{ps:LOG.slice(4),sh:LOG.slice(4)},
 viz:{st:[{l:'app.log',v:LOG,hl:[4,5,6],dim:1},{l:'tail -n 3',v:LOG.slice(4)}]},

 no:[[`tip`,`<code>tail -f</code> is how you watch a server log while you reproduce a bug. Stop it with Ctrl+C.`]],

C({id:'wc',cat:'view',lvl:'B',name:'wc',t:`Count lines and words`,
 c:{cmd:`find /c /v "" app.log`,ps:`Get-Content app.log | Measure-Object -Line -Word`,sh:`wc -l app.log`},
 out:{cmd:[``,`---------- APP.LOG: 7`],ps:[``,`Lines Words Characters Property`,`----- ----- ---------- --------`,`    7    34`,``],sh:[`7 app.log`]},

 no:[[`tip`,`The CMD trick counts lines that do <b>not</b> contain an empty string, which is every line.`],[`tip`,`<code>wc -l</code> counts newline characters, so a last line without one isn't counted.`]],

C({id:'diff',cat:'view',lvl:'I',name:'diff',t:`Compare two files`,
 c:{cmd:`fc old.txt new.txt`,ps:`Compare-Object (Get-Content old.txt) (Get-Content new.txt)`,sh:`diff old.txt new.txt`},
 out:{cmd:[`Comparing files old.txt and NEW.TXT`,`***** old.txt`,`Fix login bug`,`Call Ravi`,`***** NEW.TXT`,`Fix signup bug`,`Call Ravi`,`*****`,``,`***** old.txt`,`***** NEW.TXT`,`Book tickets`,`*****`],
  ps:[``,`InputObject    SideIndicator`,`-----------    -------------`,`Fix signup bug =>`,`Book tickets   =>`,`Fix login bug  <=`,``],
  sh:[`2c2`,`< Fix login bug`,`---`,`> Fix signup bug`,`3a4`,`> Book tickets`]},
 viz:{st:[{l:'old.txt',v:NOTES,hl:[1]},{l:'new.txt',v:[`Buy milk`,`Fix signup bug`,`Call Ravi`,`Book tickets`],hl:[1,3]}],cmp:1},
 an:[[`diff`,`show what changed between two files`],[`old.txt`,`the "before" file; its lines are marked <`],[`new.txt`,`the "after" file; its lines are marked >`]],
 fl:[[`Ignore case`,`fc /c`,`(ignores case by default)`,`diff -i`],[`Ignore whitespace`,`fc /w`,`—`,`diff -w`],[`Unified format, like git`,`—`,`—`,`diff -u`],[`Compare two folders`,`—`,`—`,`diff -r dir1 dir2`]],
 no:[[`tip`,`<code>diff -u</code> prints the same format git uses, so learning it pays off in code reviews.`],[`tip`,`Read <code>2c2</code> as: line 2 of the first file <b>c</b>hanged into line 2 of the second. <b>a</b> means added, <b>d</b> means deleted.`]],

/* ---------------- Search & transform ---------------- */
C({id:'grep',cat:'text',lvl:'B',name:'grep',t:`Search text in files`,
 c:{cmd:`findstr "ERROR" app.log`,ps:`Select-String "ERROR" app.log`,sh:`grep ERROR app.log`},al:`sls`,
 out:{cmd:[LOG[2],LOG[5]],ps:[``,`app.log:3:${LOG[2]}`,`app.log:6:${LOG[5]}`,``],sh:[LOG[2],LOG[5]]},

 an:[[`grep`,`global regular expression print: print the lines that match`],[`ERROR`,`the pattern to look for`],[`app.log`,`the file to search`]],
 fl:[[`Ignore case`,`findstr /i`,`(ignores case by default)`,`grep -i`],[`Lines that do NOT match`,`findstr /v`,`Select-String ... -NotMatch`,`grep -v`],[`Show line numbers`,`findstr /n`,`(shown by default)`,`grep -n`],[`Search every file in subfolders`,`findstr /s "ERROR" *.log`,`Get-ChildItem -Recurse *.log | Select-String ERROR`,`grep -r ERROR .`],[`Count matching lines`,`find /c "ERROR" app.log`,`(Select-String ERROR app.log).Count`,`grep -c ERROR app.log`],[`Lines around each match`,`—`,`Select-String ... -Context 2`,`grep -C 2`]],
 no:[[`warn`,`Select-String ignores case by default; grep and findstr don't. Add <code>-CaseSensitive</code> in PowerShell when case matters.`],[`warn`,`<code>findstr "A B"</code> means A <b>or</b> B. For the exact phrase, use <code>findstr /c:"A B"</code>.`]],
 qa:[[`How do you find every file that contains a word in a project?`,`grep -rn "word" . (add -l to print only file names). PowerShell: Get-ChildItem -Recurse | Select-String "word".`],[`What does grep -v do?`,`Inverts the match: it prints only the lines that do not contain the pattern.`]]});

C({id:'sort',cat:'text',lvl:'B',name:'sort',t:`Sort lines`,
 c:{cmd:`sort names.txt`,ps:`Get-Content names.txt | Sort-Object`,sh:`sort names.txt`},
 out:{cmd:[...NAMES].sort(),ps:[...NAMES].sort(),sh:[...NAMES].sort()},
 viz:{st:[{l:'names.txt',v:NAMES},{l:'sort',v:[...NAMES].sort()}]},
 an:[[`sort`,`put lines in alphabetical order`],[`names.txt`,`the file`]],
 fl:[[`Reverse order`,`sort /r`,`Sort-Object -Descending`,`sort -r`],[`Numbers by value`,`—`,`Sort-Object { [int]$_ }`,`sort -n`],[`Remove duplicates`,`—`,`Sort-Object -Unique`,`sort -u`],[`By the 2nd column of a CSV`,`—`,`Import-Csv f | Sort-Object name`,`sort -t, -k2 f`]],
 no:[[`warn`,`Without <code>-n</code>, numbers sort as text: 10 comes before 9.`]],

C({id:'uniq',cat:'text',lvl:'I',name:'uniq',t:`Remove or count duplicates`,
 c:{cmd:null,ps:`Get-Content names.txt | Sort-Object | Get-Unique`,sh:`sort names.txt | uniq`},x:NO_CMD,
 out:{ps:[`Anita`,`Kiran`,`Meera`,`Ravi`],sh:[`Anita`,`Kiran`,`Meera`,`Ravi`]},
 viz:{st:[{l:'names.txt',v:NAMES},{l:'sort',v:[...NAMES].sort(),hl:[1,5]},{l:'uniq',v:[`Anita`,`Kiran`,`Meera`,`Ravi`]}]},
 an:[[`sort names.txt`,`put equal lines next to each other`],[`|`,`pass the result on`],[`uniq`,`drop a line if it equals the one just before it`]],
 fl:[[`Count each value`,`—`,`Get-Content f | Group-Object | Select-Object Count, Name`,`sort f | uniq -c`],[`Only the duplicated values`,`—`,`Get-Content f | Group-Object | Where-Object Count -gt 1`,`sort f | uniq -d`],[`Top 3 most frequent`,`—`,`Get-Content f | Group-Object | Sort-Object Count -Descending | Select-Object -First 3`,`sort f | uniq -c | sort -rn | head -3`]],
 no:[[`warn`,`uniq only removes <b>neighbouring</b> duplicates. That is why it almost always comes after sort.`]],
 qa:[[`Why is sort run before uniq?`,`uniq compares each line only with the line before it, so equal lines must be next to each other.`],[`How do you find the most frequent IP addresses in an access log?`,`cut -d" " -f1 access.log | sort | uniq -c | sort -rn | head. A classic interview one-liner.`]]});

C({id:'cut',cat:'text',lvl:'I',name:'cut',t:`Pick a column`,
 c:{cmd:`for /f "tokens=2 delims=," %a in (data.csv) do @echo %a`,ps:`Import-Csv data.csv | Select-Object -ExpandProperty name`,sh:`cut -d, -f2 data.csv`},
 out:{cmd:[`name`,`Ravi`,`Meera`,`Kiran`],ps:[`Ravi`,`Meera`,`Kiran`],sh:[`name`,`Ravi`,`Meera`,`Kiran`]},
 viz:{st:[{l:'data.csv',v:CSV},{l:'cut -d, -f2',v:[`name`,`Ravi`,`Meera`,`Kiran`]}]},
 an:[[`cut`,`cut out part of each line`],[`-d,`,`delimiter: split each line at commas`],[`-f2`,`keep field 2 (counting from 1)`],[`data.csv`,`the file`]],
 fl:[[`Several columns`,`tokens=1,3`,`Select-Object id, city`,`cut -d, -f1,3`],[`Skip the header row`,`for /f "skip=1 tokens=2 delims=," ...`,`(the header becomes column names)`,`tail -n +2 f | cut -d, -f2`],[`Split on spaces`,`tokens=2`,`($_ -split " ")[1]`,`awk '{print $2}' f`]],
 no:[[`tip`,`PowerShell reads the header row and gives you real column names, so you never count fields.`],[`warn`,`Inside a .bat file, write <code>%%a</code> instead of <code>%a</code>.`],[`warn`,`cut doesn't understand quoted commas such as "Hyderabad, IN". Use a CSV-aware tool for real CSV.`]],
 qa:[[`How do you print the second column of a space-separated file?`,`awk '{print $2}' file. awk treats runs of spaces as one separator; cut -d" " does not.`]]});

C({id:'sed',cat:'text',lvl:'A',name:'sed',t:`Find and replace text`,
 c:{cmd:null,ps:`(Get-Content notes.txt) -replace 'Ravi','Kiran'`,sh:`sed 's/Ravi/Kiran/g' notes.txt`},x:NO_CMD,
 out:{ps:[`Buy milk`,`Fix login bug`,`Call Kiran`],sh:[`Buy milk`,`Fix login bug`,`Call Kiran`]},
 viz:{st:[{l:'notes.txt',v:NOTES,hl:[2]},{l:"s/Ravi/Kiran/g",v:[`Buy milk`,`Fix login bug`,`Call Kiran`],hl:[2]}]},
 an:[[`sed`,`stream editor: edits text as it flows through`],[`'s/Ravi/Kiran/g'`,`s = substitute, /find/replace/, g = every match on the line`],[`notes.txt`,`input file; it is not changed unless you add -i`]],
 fl:[[`Save changes into the file`,`—`,`(Get-Content f) -replace 'a','b' | Set-Content f`,`sed -i 's/a/b/g' f`],[`Ignore case`,`—`,`(ignores case by default)`,`sed 's/a/b/gI' f  (GNU sed)`],[`Delete matching lines`,`findstr /v "word" f`,`Get-Content f | Where-Object { $_ -notmatch 'word' }`,`sed '/word/d' f`],[`Print only lines 2 to 4`,`—`,`Get-Content f | Select-Object -Index (1..3)`,`sed -n '2,4p' f`]],
 no:[[`warn`,`On macOS, <code>sed -i</code> needs an empty backup suffix: <code>sed -i '' 's/a/b/g' f</code>.`],[`warn`,`Wrap <code>Get-Content</code> in brackets before writing back to the same file, so it finishes reading first.`],[`tip`,`PowerShell's <code>-replace</code> uses regular expressions, just like sed.`]],
 qa:[[`How do you replace a word in many files at once?`,`sed -i 's/old/new/g' *.txt. For subfolders, combine with find: find . -name '*.txt' -exec sed -i 's/old/new/g' {} +`]]});

/* ---------------- Pipes & redirection ---------------- */
C({id:'pipe',cat:'flow',lvl:'B',name:'|',t:`Send output into the next command`,
 c:{cmd:`tasklist | findstr python`,ps:`Get-Process | Where-Object Name -like "*python*"`,sh:`ps aux | grep python`},
 out:{cmd:[`python.exe                    8120 Console                    1     42,316 K`],ps:[``,`Handles  NPM(K)    PM(K)      WS(K)     CPU(s)     Id  SI ProcessName`,`-------  ------    -----      -----     ------     --  -- -----------`,`    212      21    38412      42316       1.25   8120   1 python`,``],sh:[`gk        8120  0.4  1.2 210344 42316 pts/0    S    10:05   0:01 python3 app.py`,`gk        8301  0.0  0.0   6440   720 pts/1    S+   10:22   0:00 grep python`]},
 viz:{st:[{l:'ps aux',v:[`/sbin/init`,`sshd`,`python3 app.py`,`nginx`,`-bash`,`grep python`],hl:[2,5],dim:1},{l:'grep python',v:[`python3 app.py`,`grep python`]}]},
 an:[[`ps aux`,`command 1: list every process`],[`|`,`pipe: feed its output into the next command`],[`grep python`,`command 2: keep only lines containing "python"`]],
 fl:[[`Chain three commands`,`a | b | c`,`a | b | c`,`a | b | c`],[`Page long output`,`dir | more`,`Get-ChildItem | more`,`ls -l | less`]],
 no:[[`tip`,`PowerShell pipes <b>objects</b>, not text. You filter by property (<code>Where-Object Name</code>) instead of searching text, so there are no columns to cut.`],[`tip`,`Notice that <code>grep python</code> finds itself in the bash output. <code>pgrep -a python</code> avoids that.`]],

C({id:'redirect',cat:'flow',lvl:'B',name:'> >>',t:`Save output to a file`,
 c:{cmd:`dir > files.txt`,ps:`Get-ChildItem > files.txt`,sh:`ls > files.txt`},
 out:{cmd:[],ps:[],sh:[]},
 viz:{add:['files.txt']},
 an:[[`ls`,`the command whose output we capture`],[`>`,`write the output to a file, replacing what was there`],[`files.txt`,`target file, created if missing`]],
 fl:[[`Overwrite the file`,`> f`,`> f  (or | Out-File f)`,`> f`],[`Append to the end`,`>> f`,`>> f  (or | Add-Content f)`,`>> f`],[`Choose the encoding`,`—`,`| Out-File f -Encoding utf8`,`(follows your locale, usually UTF-8)`]],
 no:[[`danger`,`<code>&gt;</code> silently replaces the file's contents. Use <code>&gt;&gt;</code> to add to the end.`],[`warn`,`Windows PowerShell 5.1 writes UTF-16 with <code>&gt;</code>, which other tools may read as garbage. Use <code>Out-File -Encoding utf8</code>, or PowerShell 7.`]],

C({id:'stderr',cat:'flow',lvl:'I',name:'2>&1',t:`Capture or hide errors`,
 c:{cmd:`build.bat > log.txt 2>&1`,ps:`.\\build.ps1 *> log.txt`,sh:`./build.sh > log.txt 2>&1`},
 out:{cmd:[],ps:[],sh:[]},
 viz:{add:['log.txt']},
 an:[[`./build.sh`,`the command to run`],[`> log.txt`,`send normal output (stream 1) to log.txt`],[`2>&1`,`send errors (stream 2) to wherever stream 1 is going`]],
 fl:[[`Errors only, to a file`,`cmd 2> err.txt`,`cmd 2> err.txt`,`cmd 2> err.txt`],[`Throw all output away`,`cmd > nul`,`cmd | Out-Null`,`cmd > /dev/null`],[`Hide errors only`,`cmd 2> nul`,`cmd 2> $null`,`cmd 2> /dev/null`],[`Output and errors to one file`,`cmd > f 2>&1`,`cmd *> f`,`cmd > f 2>&1  (or &> f)`]],
 no:[[`warn`,`Order matters: <code>&gt; f 2&gt;&amp;1</code> captures both, but <code>2&gt;&amp;1 &gt; f</code> leaves errors on the screen.`],[`tip`,`0 is input, 1 is output, 2 is errors. These numbers are the same in all three shells.`]],
 qa:[[`What does 2>&1 mean?`,`Point stream 2 (stderr) at wherever stream 1 (stdout) currently goes, so errors and normal output land in the same place.`],[`What is /dev/null?`,`A special file that discards everything written to it. CMD uses nul; PowerShell uses $null or Out-Null.`]]});

C({id:'chain',cat:'flow',lvl:'I',name:'&&',t:`Run commands one after another`,
 c:{cmd:`mkdir out && cd out`,ps:`mkdir out && cd out`,sh:`mkdir out && cd out`},after:'project/out',
 out:{cmd:[],ps:[...PSH('project'),`d----          01-10-2026    10:22                out`,``],sh:[]},
 viz:{add:['out/'],here:'out/',from:''},
 an:[[`mkdir out`,`step 1`],[`&&`,`run step 2 only if step 1 succeeded`],[`cd out`,`step 2`]],
 fl:[[`Only if the previous succeeded`,`a && b`,`a && b  (PowerShell 7+)`,`a && b`],[`Only if the previous failed`,`a || b`,`a || b  (PowerShell 7+)`,`a || b`],[`Always, one after another`,`a & b`,`a; b`,`a; b`]],
 no:[[`warn`,`Windows PowerShell 5.1 doesn't support <code>&amp;&amp;</code>. Write <code>a; if ($?) { b }</code>, or upgrade to PowerShell 7.`],[`tip`,`<code>git add . &amp;&amp; git commit -m "msg" &amp;&amp; git push</code> stops at the first failure. That is the point of &amp;&amp;.`]],
 qa:[[`What is the difference between ; and && in bash?`,`; runs the next command no matter what. && runs it only if the previous one exited with code 0 (success).`],[`How does a shell know whether a command succeeded?`,`From its exit code: 0 means success, anything else is a failure. Check it with $? in bash, %ERRORLEVEL% in CMD, $LASTEXITCODE in PowerShell.`]]});

C({id:'tee',cat:'flow',lvl:'I',name:'tee',t:`Show output and save it too`,
 c:{cmd:null,ps:`Get-ChildItem | Tee-Object files.txt`,sh:`ls | tee files.txt`},x:NO_CMD,
 out:{ps:[...PSH('project'),`d----          01-10-2026    09:12                backup`,`d----          01-10-2026    09:12                src`,`-a---          01-10-2026    09:03            243 app.log`,`…`],sh:[`app.log`,`backup`,`data.csv`,`deploy.sh`,`names.txt`,`notes.txt`,`src`]},
 viz:{add:['files.txt']},
 an:[[`ls`,`the command`],[`|`,`pipe`],[`tee`,`split the stream like a T-shaped pipe fitting: screen and file`],[`files.txt`,`the file that receives a copy`]],
 fl:[[`Append instead of overwrite`,`—`,`Tee-Object f -Append`,`tee -a f`],[`Write a file that needs root`,`—`,`—`,`echo x | sudo tee /etc/f`]],

/* ---------------- Processes ---------------- */
C({id:'ps',cat:'proc',lvl:'B',name:'ps',t:`List running programs`,

C({id:'kill',cat:'proc',lvl:'B',name:'kill',t:`Stop a program`,
 c:{cmd:`taskkill /PID 8120`,ps:`Stop-Process -Id 8120`,sh:`kill 8120`},al:`kill, spps`,
 out:{cmd:[`SUCCESS: Sent termination signal to the process with PID 8120.`],ps:[],sh:[]},
 an:[[`kill`,`send a signal to a process; by default, "please stop"`],[`8120`,`the PID you got from ps`]],
 fl:[[`Force it to stop`,`taskkill /PID 8120 /F`,`Stop-Process -Id 8120 -Force`,`kill -9 8120`],[`Stop by program name`,`taskkill /IM python.exe`,`Stop-Process -Name python`,`pkill python`],[`Stop it and its children`,`taskkill /PID 8120 /T`,`—`,`pkill -P 8120`]],
 no:[[`warn`,`<code>kill -9</code> can't be caught: the program gets no chance to save or clean up. Try plain <code>kill</code> first.`],[`tip`,`Ctrl+C stops the program running in the foreground of your terminal.`]],
 qa:[[`What is the difference between kill and kill -9?`,`kill sends SIGTERM (15), asking the process to exit cleanly. kill -9 sends SIGKILL, which the OS enforces at once, so the process can't clean up.`],[`How do you stop whatever is using port 8080?`,`Linux: kill $(lsof -t -i:8080). Windows: netstat -ano | findstr :8080 to get the PID, then taskkill /PID <pid> /F.`]]});

 qa:[[`How do you keep a script running after you log out of SSH?`,`nohup ./script.sh &, or run it inside tmux or screen, or turn it into a systemd service.`]]});

C({id:'which',cat:'proc',lvl:'I',name:'which',t:`Find where a command lives`,

/* ---------------- Network ---------------- */
C({id:'ping',cat:'net',lvl:'B',name:'ping',t:`Check if a host is reachable`,
 c:{cmd:`ping -n 2 google.com`,ps:`Test-Connection google.com -Count 2`,sh:`ping -c 2 google.com`},
 out:{cmd:[``,`Pinging google.com [142.250.196.14] with 32 bytes of data:`,`Reply from 142.250.196.14: bytes=32 time=18ms TTL=117`,`Reply from 142.250.196.14: bytes=32 time=17ms TTL=117`,``,`Ping statistics for 142.250.196.14:`,`    Packets: Sent = 2, Received = 2, Lost = 0 (0% loss)`],
  ps:[``,`   Destination: google.com`,``,`Ping Source      Address          Latency(ms) Status`,`---- ------      -------          ----------- ------`,`   1 GK-LAPTOP   142.250.196.14            18 Success`,`   2 GK-LAPTOP   142.250.196.14            17 Success`,``],
  sh:[`PING google.com (142.250.196.14) 56(84) bytes of data.`,`64 bytes from 142.250.196.14: icmp_seq=1 ttl=117 time=18.2 ms`,`64 bytes from 142.250.196.14: icmp_seq=2 ttl=117 time=17.6 ms`,``,`--- google.com ping statistics ---`,`2 packets transmitted, 2 received, 0% packet loss, time 1001ms`]},
 an:[[`ping`,`send small echo packets and time the replies`],[`-c 2`,`count: stop after 2 packets`],[`google.com`,`the host to test`]],
 fl:[[`Number of pings`,`ping -n 4 host`,`Test-Connection host -Count 4`,`ping -c 4 host`],[`Ping until stopped`,`ping -t host`,`Test-Connection host -Repeat  (PowerShell 7)`,`ping host  (default)`],[`Just "up" or "down"`,`—`,`Test-Connection host -Quiet`,`ping -c 1 host > /dev/null && echo up`]],
 no:[[`warn`,`Linux and macOS ping forever until Ctrl+C; Windows stops after 4. The count flag differs too: <code>-c</code> versus <code>-n</code>.`],[`tip`,`No reply doesn't always mean the host is down. Many servers simply block ping.`]],
 qa:[[`A website won't load. How do you troubleshoot from the terminal?`,`ping the host (is it reachable?), nslookup or dig (does the name resolve?), curl -I the URL (does the web server answer, with which status?), then check ports and the firewall.`]]});

C({id:'curl',cat:'net',lvl:'I',name:'curl',t:`Call a URL or API`,
 c:{cmd:`curl -I https://example.com`,ps:`Invoke-WebRequest https://example.com -Method Head`,sh:`curl -I https://example.com`},
 out:{cmd:[`HTTP/1.1 200 OK`,`Content-Type: text/html`,`Content-Length: 1256`,`Date: Thu, 01 Oct 2026 04:52:10 GMT`],ps:[``,`StatusCode        : 200`,`StatusDescription : OK`,`Headers           : {[Content-Type, text/html], [Content-Length, 1256]}`,``],sh:[`HTTP/1.1 200 OK`,`Content-Type: text/html`,`Content-Length: 1256`,`Date: Thu, 01 Oct 2026 04:52:10 GMT`]},
 an:[[`curl`,`client for URLs: send a request and print the response`],[`-I`,`fetch the headers only (a HEAD request)`],[`https://example.com`,`the URL`]],
 fl:[[`Download a file`,`curl -O URL`,`Invoke-WebRequest URL -OutFile f`,`curl -O URL`],[`Follow redirects`,`curl -L URL`,`(follows by default)`,`curl -L URL`],[`POST JSON`,`curl -X POST -H "Content-Type: application/json" -d "{\\"a\\":1}" URL`,`Invoke-RestMethod URL -Method Post -Body '{"a":1}' -ContentType application/json`,`curl -X POST -H 'Content-Type: application/json' -d '{"a":1}' URL`],[`Read a JSON reply`,`—`,`Invoke-RestMethod URL  (returns objects)`,`curl -s URL | jq .`]],
 no:[[`warn`,`In Windows PowerShell 5.1, <code>curl</code> is an alias for Invoke-WebRequest, with different options. Type <code>curl.exe</code> to get real curl.`],[`tip`,`Windows 10 and later ship real curl.exe, so CMD takes the same flags as Linux. Only JSON quoting differs: CMD needs escaped double quotes.`]],
 qa:[[`How do you test a REST API from the command line?`,`curl with -X for the method, -H for headers and -d for the body; -i shows the response headers. In PowerShell, Invoke-RestMethod returns the JSON as objects.`]]});

C({id:'ip',cat:'net',lvl:'B',name:'ip addr',t:`Show your IP address`,

 out:{cmd:[``,`Wireless LAN adapter Wi-Fi:`,``,`   IPv4 Address. . . . . . . . . . . : 192.168.1.24`,`   Subnet Mask . . . . . . . . . . . : 255.255.255.0`,`   Default Gateway . . . . . . . . . : 192.168.1.1`],ps:[``,`IPAddress         : 192.168.1.24`,`InterfaceAlias    : Wi-Fi`,`AddressFamily     : IPv4`,`PrefixLength      : 24`,``],sh:[`1: lo: <LOOPBACK,UP> mtu 65536`,`    inet 127.0.0.1/8 scope host lo`,`2: wlan0: <BROADCAST,MULTICAST,UP> mtu 1500`,`    inet 192.168.1.24/24 brd 192.168.1.255 scope global wlan0`]},

C({id:'ports',cat:'net',lvl:'A',name:'ss',t:`See which ports are in use`,
 c:{cmd:`netstat -ano | findstr :8080`,ps:`Get-NetTCPConnection -LocalPort 8080`,sh:`ss -ltnp | grep 8080`},
 out:{cmd:[`  TCP    0.0.0.0:8080           0.0.0.0:0              LISTENING       8120`],ps:[``,`LocalAddress LocalPort RemoteAddress RemotePort State  OwningProcess`,`------------ --------- ------------- ---------- -----  -------------`,`0.0.0.0           8080 0.0.0.0                0 Listen          8120`,``],sh:[`LISTEN 0  511  0.0.0.0:8080  0.0.0.0:*  users:(("python3",pid=8120,fd=3))`]},
 an:[[`ss`,`socket statistics`],[`-l`,`listening sockets only`],[`-t`,`TCP`],[`-n`,`show numbers, not service names`],[`-p`,`show the owning process`],[`| grep 8080`,`keep only the line for port 8080`]],
 fl:[[`Every listening port`,`netstat -an | findstr LISTENING`,`Get-NetTCPConnection -State Listen`,`ss -ltn`],[`Who owns port 8080 (macOS)`,`—`,`—`,`lsof -i :8080`],[`Is a remote port open?`,`—`,`Test-NetConnection host -Port 443`,`nc -zv host 443`]],
 no:[[`tip`,`On Linux, <code>-p</code> needs sudo to show processes owned by other users.`],[`tip`,`"Address already in use" is fixed with this command: find the PID, then stop that process.`]],
 qa:[[`How do you find which process is using a port?`,`Linux: ss -ltnp | grep :PORT or lsof -i :PORT. Windows: netstat -ano | findstr :PORT, then tasklist /fi "pid eq <PID>".`]]});

C({id:'dns',cat:'net',lvl:'I',name:'dig',t:`Look up a domain (DNS)`,
 c:{cmd:`nslookup example.com`,ps:`Resolve-DnsName example.com`,sh:`dig +short example.com`},
 out:{cmd:[`Server:  router.local`,`Address:  192.168.1.1`,``,`Non-authoritative answer:`,`Name:    example.com`,`Address:  93.184.215.14`],ps:[``,`Name           Type   TTL   Section    IPAddress`,`----           ----   ---   -------    ---------`,`example.com    A      3600  Answer     93.184.215.14`,``],sh:[`93.184.215.14`]},
 an:[[`dig`,`domain information groper: a DNS lookup tool`],[`+short`,`print just the answer`],[`example.com`,`the domain to resolve`]],
 fl:[[`Mail servers`,`nslookup -type=mx example.com`,`Resolve-DnsName example.com -Type MX`,`dig MX example.com`],[`Ask a specific DNS server`,`nslookup example.com 8.8.8.8`,`Resolve-DnsName example.com -Server 8.8.8.8`,`dig @8.8.8.8 example.com`]],
 no:[[`tip`,`nslookup is also available on Linux and macOS, so it's the one DNS command that works everywhere.`]],
 qa:[[`What happens when you type a URL into a browser?`,`DNS turns the name into an IP, a TCP (and TLS) connection opens, an HTTP request goes out, and the server replies. dig and nslookup let you test the DNS step on its own.`]]});

C({id:'ssh',cat:'net',lvl:'I',name:'ssh',t:`Log in to a remote server`,
 c:{cmd:`ssh gk@10.0.0.5`,ps:`ssh gk@10.0.0.5`,sh:`ssh gk@10.0.0.5`},
 out:{cmd:[`gk@10.0.0.5's password:`,`Welcome to Ubuntu 24.04 LTS`,`gk@server:~$`],ps:[`gk@10.0.0.5's password:`,`Welcome to Ubuntu 24.04 LTS`,`gk@server:~$`],sh:[`gk@10.0.0.5's password:`,`Welcome to Ubuntu 24.04 LTS`,`gk@server:~$`]},noNext:1,
 an:[[`ssh`,`secure shell: an encrypted remote login`],[`gk`,`your username on the server`],[`@10.0.0.5`,`the server's address`]],
 fl:[[`Log in with a key file`,`ssh -i key.pem gk@host`,`ssh -i key.pem gk@host`,`ssh -i key.pem gk@host`],[`Different port`,`ssh -p 2222 gk@host`,`ssh -p 2222 gk@host`,`ssh -p 2222 gk@host`],[`Create a key pair`,`ssh-keygen`,`ssh-keygen`,`ssh-keygen -t ed25519`],[`Copy a file to the server`,`scp f gk@host:/tmp/`,`scp f gk@host:/tmp/`,`scp f gk@host:/tmp/`]],
 no:[[`tip`,`Windows 10 and later include OpenSSH, so this command is identical in all three shells.`],[`warn`,`Keep your private key private. On Linux and macOS, ssh refuses a key file that others can read: <code>chmod 600 key.pem</code>.`]],
 qa:[[`How does SSH key authentication work?`,`You keep the private key; the server stores your public key in ~/.ssh/authorized_keys. The server sends a challenge that only the private key can answer, so no password crosses the network.`]]});

/* ---------------- Permissions & users ---------------- */
C({id:'chmod',cat:'perm',lvl:'I',name:'chmod',t:`Change file permissions`,
 c:{cmd:`icacls deploy.sh /grant gk:RX`,ps:`icacls deploy.sh /grant gk:RX`,sh:`chmod 755 deploy.sh`},
 out:{cmd:ICACLS,ps:ICACLS,sh:[]},
 viz:{perm:'755'},
 an:[[`chmod`,`change mode (permissions)`],[`755`,`owner rwx (7), group r-x (5), others r-x (5)`],[`deploy.sh`,`the file`]],
 fl:[[`Make a script executable`,`(decided by extension)`,`(decided by extension)`,`chmod +x f`],[`Read-only for everyone`,`attrib +r f`,`Set-ItemProperty f IsReadOnly $true`,`chmod 444 f`],[`Private to you only`,`icacls f /inheritance:r /grant:r gk:F`,`icacls f /inheritance:r /grant:r gk:F`,`chmod 600 f`],[`A whole folder tree`,`icacls dir /grant gk:F /t`,`icacls dir /grant gk:F /t`,`chmod -R 755 dir`]],
 no:[[`tip`,`Windows has no execute bit. It decides by extension (.exe, .bat), and PowerShell scripts are governed by the execution policy instead.`],[`danger`,`<code>chmod 777</code> lets anyone change or run the file. It "fixes" permission errors by removing security.`]],
 qa:[[`What does chmod 755 mean?`,`Each digit adds read (4), write (2) and execute (1). 7 = rwx for the owner, 5 = r-x for the group and for everyone else.`],[`Why does ./script.sh say "Permission denied"?`,`The file lacks the execute bit. Run chmod +x script.sh, or start it as bash script.sh.`]]});

C({id:'chown',cat:'perm',lvl:'A',name:'chown',t:`Change the owner`,
 c:{cmd:`icacls deploy.sh /setowner gk`,ps:`icacls deploy.sh /setowner gk`,sh:`sudo chown gk:dev deploy.sh`},
 out:{cmd:ICACLS,ps:ICACLS,sh:[]},
 an:[[`sudo`,`run as administrator; changing owners needs it`],[`chown`,`change owner`],[`gk:dev`,`new owner gk, new group dev`],[`deploy.sh`,`the file`]],
 fl:[[`A whole folder`,`icacls dir /setowner gk /t`,`icacls dir /setowner gk /t`,`sudo chown -R gk:dev dir`],[`Take ownership yourself`,`takeown /f f`,`takeown /f f`,`sudo chown $USER f`],[`Change the group only`,`—`,`—`,`chgrp dev f`]],
 no:[[`tip`,`A very common fix: files created with sudo end up owned by root. <code>sudo chown -R $USER:$USER folder</code> gives them back to you.`]],
 qa:[[`What is the difference between chmod and chown?`,`chmod changes what can be done with a file (read, write, execute). chown changes who owns it.`]]});

C({id:'sudo',cat:'perm',lvl:'I',name:'sudo',t:`Run as administrator`,
 c:{cmd:`sudo notepad C:\\Windows\\System32\\drivers\\etc\\hosts`,ps:`Start-Process notepad C:\\Windows\\System32\\drivers\\etc\\hosts -Verb RunAs`,sh:`sudo nano /etc/hosts`},
 out:{cmd:[],ps:[],sh:[`[sudo] password for gk:`]},noNext:1,
 an:[[`sudo`,`superuser do: run one command as root`],[`nano /etc/hosts`,`the command that needs admin rights`]],
 fl:[[`Open an admin shell`,`(right-click, Run as administrator)`,`Start-Process pwsh -Verb RunAs`,`sudo -i`],[`Repeat the last command as admin`,`—`,`—`,`sudo !!`],[`Run as another user`,`runas /user:name cmd`,`Start-Process cmd -Credential name`,`sudo -u name cmd`]],
 no:[[`warn`,`<code>sudo</code> on Windows exists only on Windows 11 24H2 and later, and must be turned on in Settings, System, For developers.`],[`danger`,`Don't paste <code>sudo</code> commands from the internet that you don't understand. They run with full control of the machine.`]],
 qa:[[`What is the difference between su and sudo?`,`su switches to another user (usually root) with that user's password. sudo runs one command as root with your own password, and is logged and limited by /etc/sudoers.`]]});

C({id:'whoami',cat:'perm',lvl:'B',name:'whoami',t:`Show the current user`,
 c:{cmd:`whoami`,ps:`whoami`,sh:`whoami`},
 out:{cmd:[`gk-laptop\\gk`],ps:[`gk-laptop\\gk`],sh:[`gk`]},

 no:[[`tip`,`Windows prints <code>machine\\user</code>, or <code>domain\\user</code> on a work PC.`]],
 qa:[[`How do you check whether you are root?`,`whoami prints root, or id -u prints 0.`]]});

/* ---------------- System & environment ---------------- */
C({id:'env',cat:'sys',lvl:'B',name:'echo $VAR',t:`Read an environment variable`,
 c:{cmd:`echo %USERNAME%`,ps:`$env:USERNAME`,sh:`echo $USER`},
 out:{cmd:[`gk`],ps:[`gk`],sh:[`gk`]},
 an:[[`echo`,`print`],[`$USER`,`$ means "the value of"; USER is the variable's name`]],
 fl:[[`List every variable`,`set`,`Get-ChildItem env:`,`env  (or printenv)`],[`Your home folder`,`echo %USERPROFILE%`,`$HOME`,`echo $HOME`],[`Temp folder`,`echo %TEMP%`,`$env:TEMP`,`echo $TMPDIR  (or /tmp)`]],
 no:[[`warn`,`Names are case-insensitive on Windows (%path% is %PATH%) but case-sensitive on Linux ($user is not $USER).`]],
 qa:[[`What is an environment variable?`,`A named value the OS passes to every program started from that shell, such as PATH, HOME or an API key. Programs read them for configuration.`]]});

C({id:'export',cat:'sys',lvl:'I',name:'export',t:`Set an environment variable`,
 c:{cmd:`set APP_ENV=dev`,ps:`$env:APP_ENV = "dev"`,sh:`export APP_ENV=dev`},
 out:{cmd:[],ps:[],sh:[]},
 an:[[`export`,`make the variable visible to programs started from this shell`],[`APP_ENV`,`the name`],[`=dev`,`the value; no spaces around =`]],
 fl:[[`Keep it for new terminals`,`setx APP_ENV dev`,`[Environment]::SetEnvironmentVariable("APP_ENV","dev","User")`,`add the export line to ~/.bashrc or ~/.zshrc`],[`For one command only`,`—`,`—`,`APP_ENV=dev python3 app.py`],[`Remove it`,`set APP_ENV=`,`Remove-Item env:APP_ENV`,`unset APP_ENV`]],
 no:[[`warn`,`Spaces matter. <code>export A = 1</code> fails in bash, and <code>set A = 1</code> in CMD makes a variable named "A " with the value " 1".`],[`tip`,`<code>setx</code> doesn't change the window you're in. Open a new terminal to see the value.`]],
 qa:[[`Why does my variable disappear when I close the terminal?`,`set, $env: and export only last for that session. Use setx, your PowerShell $PROFILE, or ~/.bashrc to keep it.`],[`Shell variable vs environment variable?`,`A shell variable (A=1) is visible only inside that shell. export copies it into the environment so child processes see it too.`]]});

C({id:'path',cat:'sys',lvl:'I',name:'$PATH',t:`See where commands are searched`,
 c:{cmd:`echo %PATH%`,ps:`$env:Path -split ";"`,sh:`echo $PATH | tr ':' '\\n'`},
 out:{cmd:[`C:\\Windows\\system32;C:\\Windows;C:\\Program Files\\Git\\cmd;C:\\Users\\gk\\AppData\\Local\\Programs\\Python\\Python312`],ps:[`C:\\Windows\\system32`,`C:\\Windows`,`C:\\Program Files\\Git\\cmd`,`C:\\Users\\gk\\AppData\\Local\\Programs\\Python\\Python312`],sh:[`/usr/local/bin`,`/usr/bin`,`/bin`,`/home/gk/.local/bin`]},
 an:[[`echo $PATH`,`print the PATH variable`],[`|`,`pipe it into`],[`tr ':' '\\n'`,`translate each : into a new line so it's readable`]],
 fl:[[`Add a folder, this session only`,`set PATH=%PATH%;C:\\tools`,`$env:Path += ";C:\\tools"`,`export PATH="$PATH:$HOME/tools"`]],
 no:[[`warn`,`The separator is <code>;</code> on Windows and <code>:</code> on Linux and macOS.`],[`tip`,`Folders are searched left to right, and the first match wins.`],[`warn`,`Avoid <code>setx PATH "%PATH%;..."</code>: it can cut PATH off at 1024 characters and mixes system and user entries. Use the Environment Variables dialog instead.`]],
 qa:[[`What is PATH?`,`A list of folders the shell searches, in order, when you type a command name without a path.`],[`Why do you need ./ to run a script in the current folder on Linux?`,`The current folder isn't on PATH, for security, so you must give a path: ./script.sh.`]]});

/* ---------------- General interview questions ---------------- */
const GEN=[
 [`What is the difference between a terminal and a shell?`,`The terminal is the window that shows text and takes your keystrokes. The shell is the program running inside it that interprets commands. Windows Terminal can host PowerShell, CMD or bash.`],
 [`How is PowerShell different from bash?`,`PowerShell passes objects instead of text, uses Verb-Noun command names, is case-insensitive and is built on .NET. Bash chains small text tools. PowerShell 7 also runs on Linux and macOS.`],
 [`What are stdin, stdout and stderr?`,`The three standard streams: 0 is input, 1 is normal output, 2 is errors. Redirection (>, 2>, 2>&1) works by pointing these streams somewhere else.`],
 [`What is an exit code?`,`A number a program returns when it finishes. 0 means success and anything else is a failure. Scripts and && / || decide what to do next based on it.`],
 [`What is a shebang?`,`The first line of a script, like #!/bin/bash or #!/usr/bin/env python3. It tells the OS which interpreter should run the file.`],
 [`Why won't my .ps1 script run?`,`PowerShell's execution policy blocks scripts by default on Windows clients. Set-ExecutionPolicy -Scope CurrentUser RemoteSigned allows your own local scripts.`],
 [`Single quotes vs double quotes in bash?`,`Single quotes keep everything literal. Double quotes still expand variables and $(commands). PowerShell follows the same rule.`],
 [`A bash script fails with "bad interpreter: /bin/bash^M". Why?`,`The file has Windows line endings (CRLF). Convert it to LF with dos2unix, or change the line ending in your editor.`],
 [`How do you run a command on every file a search finds?`,`find . -name "*.log" -exec gzip {} + in bash, or pipe into xargs. In PowerShell: Get-ChildItem *.log | ForEach-Object { ... }.`],
 [`What is the difference between a process and a service (daemon)?`,`A process is any running program. A service, or daemon on Linux, is a background process started and managed by the system, usually at boot, without a terminal.`]
];

C({id:'svc',cat:'admin',lvl:'I',name:'systemctl',t:`List services`,
